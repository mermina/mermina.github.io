<svg viewBox="0 0 920 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7fc9a6"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="18" fill="#f6f4ee"/>
  <text x="40" y="46" font-size="13" font-weight="600" letter-spacing="1.5" fill="#2f7d5b">AUTOMATION — HOW IT WORKS</text>
  <text x="40" y="70" font-size="15" fill="#5b6b62">Two kinds of messy input. One tidy spreadsheet, filled without anyone typing.</text>

  <!-- ── Lane A: FarmBot ── -->
  <g>
    <rect x="40" y="98" width="168" height="70" rx="13" fill="#123324"/>
    <text x="124" y="126" text-anchor="middle" font-size="20">🎙️</text>
    <text x="124" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Voice note</text>
    <text x="124" y="163" text-anchor="middle" font-size="11" fill="#7fc9a6">spoken in the field</text>
  </g>
  <line x1="216" y1="133" x2="248" y2="133" stroke="#7fc9a6" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g>
    <rect x="256" y="98" width="190" height="70" rx="13" fill="#fff" stroke="#dfe4de"/>
    <text x="351" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#17201b">Transcribe &amp; extract</text>
    <text x="351" y="142" text-anchor="middle" font-size="11" fill="#5b6b62">Whisper + AI</text>
    <text x="351" y="158" text-anchor="middle" font-size="11" fill="#5b6b62">date · task · time spent</text>
  </g>

  <!-- ── Lane B: Market monitoring ── -->
  <g>
    <rect x="40" y="196" width="168" height="70" rx="13" fill="#123324"/>
    <text x="124" y="224" text-anchor="middle" font-size="20">🔎</text>
    <text x="124" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">10 searches</text>
    <text x="124" y="261" text-anchor="middle" font-size="11" fill="#7fc9a6">English + Íslenska</text>
  </g>
  <line x1="216" y1="231" x2="248" y2="231" stroke="#7fc9a6" stroke-width="2.5" marker-end="url(#arr3)"/>
  <g>
    <rect x="256" y="196" width="190" height="70" rx="13" fill="#fff" stroke="#dfe4de"/>
    <text x="351" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#17201b">Read &amp; classify</text>
    <text x="351" y="240" text-anchor="middle" font-size="11" fill="#5b6b62">Python + BeautifulSoup</text>
    <text x="351" y="256" text-anchor="middle" font-size="11" fill="#5b6b62">price · logo · region</text>
  </g>

  <!-- ── converge ── -->
  <path d="M454 133 L520 133 Q542 133 542 155 L542 176" fill="none" stroke="#7fc9a6" stroke-width="2.5"/>
  <path d="M454 231 L520 231 Q542 231 542 209 L542 188" fill="none" stroke="#7fc9a6" stroke-width="2.5"/>
  <line x1="542" y1="182" x2="606" y2="182" stroke="#7fc9a6" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- ── Google Sheet ── -->
  <g>
    <rect x="614" y="130" width="150" height="105" rx="14" fill="#2f7d5b"/>
    <text x="689" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Google Sheet</text>
    <rect x="632" y="168" width="114" height="52" rx="6" fill="#fff"/>
    <line x1="632" y1="185" x2="746" y2="185" stroke="#cfe3d8" stroke-width="1.5"/>
    <line x1="632" y1="202" x2="746" y2="202" stroke="#cfe3d8" stroke-width="1.5"/>
    <line x1="670" y1="168" x2="670" y2="220" stroke="#cfe3d8" stroke-width="1.5"/>
    <line x1="708" y1="168" x2="708" y2="220" stroke="#cfe3d8" stroke-width="1.5"/>
  </g>
  <text x="800" y="176" font-size="12" font-weight="600" fill="#2f7d5b">Dated rows,</text>
  <text x="800" y="193" font-size="12" font-weight="600" fill="#2f7d5b">sorted, ready</text>
  <text x="800" y="210" font-size="12" font-weight="600" fill="#2f7d5b">to use.</text>
</svg>
